version: '3.8'

services:
  api:
    build: .
    ports:
      - "42069:42069"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=zoozie
      - JWT_SECRET=your_jwt_secret_here
      - APP_URL=http://localhost:42069
      # Add other env vars here or use an .env file
    volumes:
      - ./public:/public
    restart: on-failure

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zoozie
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
